<!-- PLACEHOLDER reveal detail: a generic close-up of woven cloth, a stitched seam
     and a label edge. Replace with the client's 1–2 close-up teaser photos
     (list them in content/site.json > revealImages). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <pattern id="twill" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <rect width="14" height="14" fill="#5a5a5a"/>
      <rect width="7" height="14" fill="#7d7d7d"/>
      <rect x="7" width="2" height="14" fill="#9a9a9a"/>
    </pattern>
    <pattern id="rib" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <rect width="10" height="10" fill="#c4c4c4"/>
      <rect width="10" height="3" fill="#a9a9a9"/>
    </pattern>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9 .06" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    </filter>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="light" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#twill)"/>
  <rect width="1200" height="800" filter="url(#fiber)"/>
  <!-- seam -->
  <path d="M-40 520 C 260 470, 520 600, 820 520 S 1180 430, 1260 470" fill="none" stroke="url(#fold)" stroke-width="70"/>
  <path d="M-40 520 C 260 470, 520 600, 820 520 S 1180 430, 1260 470" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round" transform="translate(0 -26)"/>
  <path d="M-40 520 C 260 470, 520 600, 820 520 S 1180 430, 1260 470" fill="none" stroke="#e8e8e8" stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round" transform="translate(0 30)"/>
  <!-- label edge -->
  <g transform="rotate(-9 820 190)">
    <rect x="640" y="70" width="520" height="210" fill="#2a2a2a" opacity=".5" transform="translate(10 16)"/>
    <rect x="640" y="70" width="520" height="210" fill="url(#rib)"/>
    <path d="M640 70 h520 M640 280 h520" stroke="#888" stroke-width="5"/>
    <path d="M660 92 h480" stroke="#4a4a4a" stroke-width="4" stroke-dasharray="16 11" stroke-linecap="round"/>
  </g>
  <rect width="1200" height="800" fill="url(#light)"/>
</svg>
